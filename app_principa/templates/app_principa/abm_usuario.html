<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABM Usuarios - Kiosco</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            padding: 20px;
        }

        .top-nav {
            margin-bottom: 10px;
        }
        .top-nav a {
            color: #333;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .top-nav a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: #000;
        }

        /* ── FORMULARIO ── */
        .form-card {
            background: #e2e5e9;
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 600px;
            margin: 0 auto 35px auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 6px;
        }

        .form-group input, 
        .form-group select {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px 12px;
            color: #333;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #666;
        }

        .btn-guardar {
            width: 100%;
            background: #e65c00;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-guardar:hover { 
            background: #cc5200; 
        }

        #msg-form-usu {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        /* ── TABLA ── */
        .tabla-card {
            background: #e2e5e9;
            border-radius: 12px;
            padding: 24px;
            max-width: 950px;
            margin: 0 auto;
        }
        
        .tabla-card h2 {
            font-size: 1.1rem;
            color: #333;
            text-align: center;
            margin-bottom: 16px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            color: #333;
        }

        th { 
            font-weight: bold; 
            border-bottom: 2px solid #ccc; 
        }
        
        td { 
            border-bottom: 1px solid #d0d5dd; 
        }

        .acciones { 
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-edit, .btn-del {
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-edit { background: #e67e22; color: #fff; }
        .btn-del  { background: #111; color: #fff; }
        .btn-edit:hover { background: #d06d19; }
        .btn-del:hover  { background: #000; }
    </style>
</head>
<body>
    <h1>ABM Usuarios</h1>

    <form class="form-card" method="POST">
        <input type="hidden" id="usu-id">

        <div class="form-group">
            <label>Nombre de usuario</label>
            <input type="text" id="usu-nombre" placeholder="Ej: Catalina433">
        </div>

        <div class="form-group">
            <label>Nombre y Apellido</label>
            <input type="text" id="usu-nombre-apellido" placeholder="Ej: Juliana Gomez">
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select id="usu-rol">
                <option value="">Seleccione un rol</option>
                <option value="Gerente">Gerente</option>
                <option value="Administrador">Administrador</option>
                <option value="Cajero">Cajero</option>
                <option value="Repositor">Repositor</option>
            </select>
        </div>

         <div class="form-group">
            <label>Contrasena</label>
            <input type="text" id="usu-contrasena" placeholder="Ej: ********">
        </div>


        <button type="submit" class="btn-guardar">GUARDAR</button>
        <p id="msg-form-usu"></p>
    </form>

    <!-- Tabla Historial de Usuarios -->
    <div class="tabla-card">
        <h2>Historial de usuarios</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre usuario</th>
                    <th>Nombre y Apellido</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-body-usuarios">
                {% for each usuario%}
                <tr>
                    
                </tr>
                {%%}
            </tbody>
        </table>
    </div>

<script src="JavaScr/logica_abmUsauario.js"></script>
</body>
</html>
