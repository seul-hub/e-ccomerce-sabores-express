<!DOCTYPE html>
<html lang="es">
<head>
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<style>

.panel-imagen {
    overflow: hidden; /* evita que la entrada desde la izquierda cree scroll horizontal */
}

#imagen-login {
    display: block;
    max-width: 100%;
    transform-origin: bottom left; /* al "respirar" no se despega de la esquina de abajo */
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background: #df752f;
}

.login-box{
    width:350px;
    background:white;
    padding:40px;
    border-radius:15px;
    background-image: linear-gradient(135deg, #f97316, #cc1919);
    margin-left: 500px;
}

.login-box h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#ffffff;
}

.btn{
    width:100%;
    padding:12px;
    background:#000000;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.btn:hover{
    background:#2f8df7;
}

.extra{
    text-align:center;
    margin-top:15px;
}

.extra a{
    text-decoration:none;
    color:#4facfe;
}

@media (max-width: 768px) {
    .Logo {
        display: none;
    }
}

.Logo {
    position: absolute;
    top: 0;
    left: 0;
    width: 34%;
    height: auto;
}
</style>
</head>
<body>
    <div class="panel-imagen" style="max-width: 30%;">
        <img id="imagen-login" src="{% static 'bienvenida.png' %}" alt="Sabores Express">
    </div>

    <div class="login-box">
        <h2>Registro de Usuario</h2>

        <form id="formRegistro" method="post">
            {% csrf_token %}

            <div class="input-box">
                <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
            </div>

            <div class="input-box">
                <input type="text" id="usuario" name="usuario" placeholder="Usuario" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>

            {% if error %}
                <p style="color: #ffffff; text-align: center; margin-bottom: 15px; font-size: 14px;">
                    {{ error }}
                </p>
            {% endif %}

            <button type="submit" class="btn">Registrarse</button>

            <div class="extra">
                <p><a href="{% url 'login' %}">Volver al Login</a></p>
            </div>
        </form>
    </div>

    <script src="{% static 'animacion.js' %}"></script>
</body>
</html>
