<!DOCTYPE html>
<html lang="es">
<head>
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<!-- by brisa esc --> 
 <style> 

.panel-imagen {
    overflow: hidden; /* evita que la entrada desde la izquierda cree scroll horizontal */
}

#imagen-login {
    display: block;
    max-width: 100%;
    transform-origin: bottom left; /* al "respirar" no se despega de la esquina de abajo */
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background: #df752f;
}

.login-box{
    width:350px;
    background:white;
    padding:40px;
    border-radius:15px;
     background-image: linear-gradient(135deg, #f97316, #cc1919);
     margin-left: 500px;
     
}

.login-box h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#ffffff;
}

.btn{
    width:100%;
    padding:12px;
    background:#000000;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.btn:hover{
    background:#2f8df7;
}

.extra{
    text-align:center;
    margin-top:15px;
}

.extra a{
    text-decoration:none;
    color:#4facfe;
}

 @media (max-width: 768px) {
        .Logo {
        display: none; 
      
        }
        
    
}

.Logo {
    position: absolute;
    top: 0;
    left: 0;
    width: 34%; 
    height: auto;
}
</style>
</head>
<body>
<div class="panel-imagen" style="max-width: 30%;">
    <img id="imagen-login" src="{% static 'bienvenida.png' %}" alt="Sabores Express" >
</div>

<div class="login-box">
    <h2>Nueva contraseña</h2>

    {% if error %}
        <p style="color:#ffffff;text-align:center;margin-bottom:15px;font-size:14px;">
            {{ error }}
        </p>
    {% endif %}

    <form id="formReset" method="post" action="{% url 'recuperar_nueva_clave' %}">
        {% csrf_token %}

        <div class="input-box">
            <input type="password" id="password" name="password"
                   placeholder="Nueva contraseña"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   title="Debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número"
                   required>
        </div>

        <div id="password-message">
            <h3>La contraseña debe contener:</h3>
            <p class="password-message-item invalid">Al menos <b>una letra minúscula</b></p>
            <p class="password-message-item invalid">Al menos <b>una letra mayúscula</b></p>
            <p class="password-message-item invalid">Al menos <b>un número</b></p>
            <p class="password-message-item invalid">Al menos <b>8 caracteres</b></p>
        </div>

        <div class="input-box">
            <input type="password" id="password2" name="password2"
                   placeholder="Repetir contraseña"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   title="Debe coincidir con la contraseña anterior"
                   required>
        </div>

        <button type="submit" class="btn">Guardar contraseña</button>

        <div class="extra">
            <p><a href="{% url 'login' %}">Volver al login</a></p>
        </div>
    </form>

</div>

</body>
<script src="{% static 'validacion.js' %}"></script>
<script src="{% static 'animacion.js' %}"></script>
</html>
