<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce de Banfield - Panel de Cajero / Pedidos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Generales y Reseteo */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* Encabezado del Cajero */
        .cajero-header {
            background-color: #111827;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .header-container {
            max-width: 80rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
            height: 5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .titulo-cajero {
            font-weight: 800;
            font-size: 1.5rem;
            line-height: 2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Contenedor Principal */
        .contenido-principal {
            flex: 1;
            max-width: 80rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
            padding-top: 2rem;
            padding-bottom: 2rem;
            width: 100%;
        }

        .contenedor-tarjetas {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .contenedor-tarjetas {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .tarjeta-resumen {
            background-color: #ffffff;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .tarjeta-titulo {
            font-size: 0.75rem;
            line-height: 1rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tarjeta-valor {
            font-size: 1.875rem;
            line-height: 2.25rem;
            font-weight: 700;
            color: #111827;
            margin-top: 0.5rem;
        }

        /* Sección de Tabla de Pedidos */
        .seccion-pedidos {
            background-color: #ffffff;
            border-radius: 1rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-top: 1.5rem;
        }

        .seccion-cabecera {
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .seccion-titulo {
            font-weight: 700;
            color: #111827;
            font-size: 1rem;
        }

        .contenedor-tabla {
            overflow-x: auto;
        }

        .tabla-pedidos {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .tabla-pedidos th {
            background-color: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
        }

        .tabla-pedidos td {
            padding: 1rem 1.5rem;
        }

        .fila-tabla {
            border-top: 1px solid #f3f4f6;
            transition: background-color 0.2s ease-in-out;
        }

        .fila-tabla:hover {
            background-color: #f9fafb;
        }

        .fila-vacia td {
            text-align: center;
            color: #6b7280;
            padding: 2rem 1.5rem;
        }

        .texto-negrita {
            font-weight: 700;
            color: #111827;
        }

        .texto-secundario {
            color: #4b5563;
            font-size: 0.75rem;
        }

        /* Etiquetas de Estado (mismos estados que el modelo Pedido) */
        .estado-espera {
            background-color: #fef3c7;
            color: #b45309;
            font-size: 0.75rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .estado-preparacion {
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.75rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        /* Botones de Acción */
        .grupo-botones {
            text-align: center;
            white-space: nowrap;
        }

        .grupo-botones > * + * {
            margin-left: 0.5rem;
        }

        .btn-preparar {
            background-color: #f59e0b;
            color: #ffffff;
            padding: 0.375rem 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-preparar:hover {
            background-color: #d97706;
        }

        .btn-finalizar {
            background-color: #16a34a;
            color: #ffffff;
            padding: 0.375rem 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-finalizar:hover {
            background-color: #15803d;
        }

        .btn-cancelar {
            background-color: #dc2626;
            color: #ffffff;
            padding: 0.375rem 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-cancelar:hover {
            background-color: #b91c1c;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-oculto {
            display: none !important;
        }

        .modal-contenido {
            background-color: #e5e7eb;
            width: 100%;
            max-width: 32rem;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-cerrar-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: #1f2937;
            color: #ffffff;
            height: 2rem;
            width: 2rem;
            border-radius: 9999px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-cerrar-modal:hover {
            background-color: #000000;
        }

        .modal-titulo {
            font-size: 1.5rem;
            line-height: 2rem;
            font-weight: 700;
            color: #111827;
        }

        .modal-info {
            font-size: 0.875rem;
            color: #374151;
        }

        .modal-info p + p {
            margin-top: 0.25rem;
        }

        .modal-subtitulo {
            font-weight: 700;
            color: #111827;
            font-size: 1rem;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tabla-modal {
            width: 100%;
            font-size: 0.875rem;
        }

        .tabla-modal th {
            text-align: left;
            color: #4b5563;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 0.5rem;
        }

        .tabla-modal td {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            color: #1f2937;
        }

        .tabla-modal tbody {
            border-top: 1px solid #d1d5db;
        }

        .modal-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px solid #9ca3af;
            font-weight: 700;
            font-size: 1rem;
            color: #111827;
        }

        .btn-confirmar-modal {
            width: 100%;
            background-color: #f59e0b;
            color: #ffffff;
            font-weight: 700;
            padding-top: 0.625rem;
            padding-bottom: 0.625rem;
            border-radius: 0.75rem;
            transition: background-color 0.2s ease-in-out;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            margin-top: 0.5rem;
            cursor: pointer;
            border: none;
        }

        .btn-confirmar-modal:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>

    <!-- Header del Cajero -->
    <header class="cajero-header">
        <div class="header-container">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div>
                    <h1 class="titulo-cajero">CAJERO</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="contenido-principal">

        <!-- Tarjetas de Resumen del Día (el turno es el día de hoy) -->
        <div class="contenedor-tarjetas">
            <div class="tarjeta-resumen">
                <span class="tarjeta-titulo">Pedidos recibidos hoy</span>
                <h3 id="contador-recibidos" class="tarjeta-valor">0</h3>
            </div>

            <div class="tarjeta-resumen">
                <span class="tarjeta-titulo">En preparación</span>
                <h3 id="contador-preparacion" class="tarjeta-valor">0</h3>
            </div>

            <div class="tarjeta-resumen">
                <span class="tarjeta-titulo">Facturado en el turno</span>
                <h3 id="contador-facturado" class="tarjeta-valor">$ 0</h3>
            </div>
        </div>

        <!-- Tabla de Gestión de Pedidos en Tiempo Real -->
        <div class="seccion-pedidos">
            <div class="seccion-cabecera">
                <h2 class="seccion-titulo">Pedidos Entrantes y Acciones del Cajero</h2>
            </div>

            <div class="contenedor-tabla">
                <table class="tabla-pedidos">
                    <thead>
                        <tr>
                            <th>N° Pedido</th>
                            <th>Productos / Detalle</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <!-- Las filas las arma el script con los pedidos reales (Espera... y En preparacion).
                         Al finalizar o cancelar, el pedido sale de acá. Los finalizados aparecen en
                         el Listado General de Ventas del gerente. -->
                    <tbody id="tabla-cuerpo"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Detalle del Pedido en Grande -->
    <div id="modal-detalle" class="modal-overlay modal-oculto">
        <div class="modal-contenido">
            <!-- Botón de Cierre -->
            <button onclick="cerrarDetalle()" class="btn-cerrar-modal">&times;</button>

            <h2 id="modal-titulo" class="modal-titulo">Pedido</h2>

            <div class="modal-info">
                <p><strong>Fecha:</strong> <span id="modal-fecha"></span></p>
                <p><strong>Medio de pago:</strong> <span id="modal-pago"></span></p>
                <p><strong>Cliente:</strong> <span id="modal-cliente"></span></p>
                <p><strong>Domicilio:</strong> <span id="modal-domicilio"></span></p>
                <p><strong>Teléfono:</strong> <span id="modal-telefono"></span></p>
            </div>

            <div style="margin-top: 1rem;">
                <h3 class="modal-subtitulo">Detalle de pedido</h3>

                <table class="tabla-modal">
                    <thead>
                        <tr>
                            <th style="padding-bottom: 0.5rem;">Producto</th>
                            <th style="padding-bottom: 0.5rem; text-align: center;">Cantidad</th>
                            <th style="padding-bottom: 0.5rem; text-align: right;">Precio</th>
                        </tr>
                    </thead>
                    <tbody id="modal-items"></tbody>
                </table>

                <div class="modal-total">
                    <span>Total</span>
                    <span id="modal-total">$ 0</span>
                </div>
            </div>

            <button id="modal-btn-preparar" onclick="prepararDesdeModal()" class="btn-confirmar-modal">
                Confirmar y Pasar a En Preparación
            </button>
        </div>
    </div>

    <!-- Scripts de Funcionalidad Dinámica -->
    <script>
        const CSRF = "{{ csrf_token }}";
        const URL_ESTADO = "{% url 'cajero_estado' %}";
        const URL_ACCION = "/cajero/pedido/__ID__/__ACCION__/";
        const REFRESCO_MS = 10000;

        let pedidos = [];            // último listado recibido del servidor
        let pedidoAbiertoId = null;  // pedido que se está viendo en el modal

        const pesos = (n) => '$ ' + Number(n).toLocaleString('es-AR');

        function celda(texto, clase) {
            const td = document.createElement('td');
            if (clase) td.className = clase;
            td.textContent = texto;
            return td;
        }

        function boton(texto, clase, onclick) {
            const b = document.createElement('button');
            b.className = clase;
            b.textContent = texto;
            b.addEventListener('click', onclick);
            return b;
        }

        function pintarResumen(resumen) {
            document.getElementById('contador-recibidos').textContent = resumen.recibidos;
            document.getElementById('contador-preparacion').textContent = resumen.en_preparacion;
            document.getElementById('contador-facturado').textContent = pesos(resumen.facturado);
        }

        function pintarTabla() {
            const cuerpo = document.getElementById('tabla-cuerpo');
            cuerpo.replaceChildren();

            if (pedidos.length === 0) {
                const tr = document.createElement('tr');
                tr.className = 'fila-vacia';
                const td = celda('No hay pedidos abiertos.');
                td.colSpan = 5;
                tr.appendChild(td);
                cuerpo.appendChild(tr);
                return;
            }

            pedidos.forEach((p) => {
                const tr = document.createElement('tr');
                tr.className = 'fila-tabla';

                tr.appendChild(celda('#' + p.id, 'texto-negrita'));
                tr.appendChild(celda(p.items.map((i) => i.cantidad + 'x ' + i.producto).join(', '), 'texto-secundario'));
                tr.appendChild(celda(pesos(p.total), 'texto-negrita'));

                const tdEstado = document.createElement('td');
                const span = document.createElement('span');
                span.className = 'estado-' + p.estado;
                span.textContent = p.estado_texto;
                tdEstado.appendChild(span);
                tr.appendChild(tdEstado);

                const tdAcciones = document.createElement('td');
                tdAcciones.className = 'grupo-botones';
                if (p.estado === 'espera') {
                    tdAcciones.appendChild(boton('Preparar', 'btn-preparar', () => verDetallePedido(p.id)));
                }
                tdAcciones.appendChild(boton('Finalizar', 'btn-finalizar', () => finalizarPedido(p.id)));
                if (p.estado === 'espera') {
                    // Solo se cancela en "Espera...": todavía no empezó la preparación
                    tdAcciones.appendChild(boton('Cancelar', 'btn-cancelar', () => cancelarPedido(p.id)));
                }
                tr.appendChild(tdAcciones);

                cuerpo.appendChild(tr);
            });
        }

        function aplicarDatos(datos) {
            pedidos = datos.pedidos;
            pintarResumen(datos.resumen);
            pintarTabla();

            // Si el pedido del modal ya no está abierto (lo cambió otro cajero), se cierra
            if (pedidoAbiertoId !== null) {
                const p = pedidos.find((x) => x.id === pedidoAbiertoId);
                if (!p || p.estado !== 'espera') cerrarDetalle();
            }
        }

        async function cargarEstado() {
            try {
                const resp = await fetch(URL_ESTADO, { headers: { 'Accept': 'application/json' } });
                if (resp.redirected || !resp.ok) {
                    window.location.href = "{% url 'login' %}";
                    return;
                }
                aplicarDatos(await resp.json());
            } catch (e) {
                // Sin conexión: se reintenta en el próximo ciclo
            }
        }

        async function ejecutarAccion(id, accion, mensajeOk) {
            const url = URL_ACCION.replace('__ID__', id).replace('__ACCION__', accion);
            try {
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': CSRF, 'Accept': 'application/json' },
                });
                const datos = await resp.json();
                if (datos.pedidos) aplicarDatos(datos);
                if (datos.ok) {
                    alert(mensajeOk);
                } else {
                    alert(datos.error || 'No se pudo completar la acción.');
                }
                return datos.ok;
            } catch (e) {
                alert('No se pudo conectar con el servidor.');
                return false;
            }
        }

        function verDetallePedido(id) {
            const p = pedidos.find((x) => x.id === id);
            if (!p) return;
            pedidoAbiertoId = id;

            document.getElementById('modal-titulo').textContent = 'Pedido #' + p.id;
            document.getElementById('modal-fecha').textContent = p.fecha;
            document.getElementById('modal-pago').textContent = p.forma_pago;
            document.getElementById('modal-cliente').textContent = p.cliente;
            document.getElementById('modal-domicilio').textContent = p.domicilio;
            document.getElementById('modal-telefono').textContent = p.telefono;
            document.getElementById('modal-total').textContent = pesos(p.total);

            const cuerpo = document.getElementById('modal-items');
            cuerpo.replaceChildren();
            p.items.forEach((i) => {
                const tr = document.createElement('tr');
                tr.appendChild(celda(i.producto));
                const cant = celda(i.cantidad);
                cant.style.textAlign = 'center';
                tr.appendChild(cant);
                const precio = celda(pesos(i.subtotal));
                precio.style.textAlign = 'right';
                tr.appendChild(precio);
                cuerpo.appendChild(tr);
            });

            document.getElementById('modal-detalle').classList.remove('modal-oculto');
        }

        function cerrarDetalle() {
            document.getElementById('modal-detalle').classList.add('modal-oculto');
            pedidoAbiertoId = null;
        }

        async function prepararDesdeModal() {
            if (pedidoAbiertoId === null) return;
            const id = pedidoAbiertoId;
            const ok = await ejecutarAccion(id, 'preparar', '¡Pedido cambiado al estado: En preparación!');
            if (ok) cerrarDetalle();
        }

        function finalizarPedido(id) {
            ejecutarAccion(id, 'finalizar', '¡Pedido finalizado y monto sumado al turno!');
        }

        function cancelarPedido(id) {
            if (!confirm('¿Cancelar el pedido #' + id + '? Se devolverá el stock.')) return;
            ejecutarAccion(id, 'cancelar', 'Pedido cancelado. El stock fue devuelto.');
        }

        cargarEstado();
        setInterval(cargarEstado, REFRESCO_MS);
    </script>
</body>
</html>
